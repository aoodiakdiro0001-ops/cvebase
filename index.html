body{background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-size:22px;font-weight:900;color:var(--red)}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.live{font-size:11px;font-weight:800;color:var(--grn);border:1px solid var(--grn);border-radius:12px;padding:3px 10px}
header select{margin-left:auto;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:7px 10px;font-size:13px}
.stats{display:flex;gap:12px;padding:14px 20px 0;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.stat{flex:1;min-width:130px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:22px;color:var(--red);display:block}
.stat span{font-size:11.5px;color:var(--mut)}
.tabs{display:flex;gap:6px;padding:14px 16px 0;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.tabs button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-bottom:none;padding:10px 16px;border-radius:12px 12px 0 0;cursor:pointer;font-weight:800;font-size:13px}
.tabs button.on{background:#1a2140;color:var(--red)}
main{max-width:1100px;margin:0 auto;padding:18px 15px 60px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:0 14px 14px 14px;padding:22px;display:none}
.panel.on{display:block}
.panel h2{color:var(--red);margin-bottom:6px;font-size:19px}
.panel p.sub{color:var(--mut);font-size:13px;margin-bottom:12px;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
input[type=text],select,textarea{background:#0a0c14;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 13px;font-size:13.5px;outline:none}
button.go{background:var(--red);color:#1c0505;border:none;padding:10px 22px;border-radius:10px;font-weight:900;cursor:pointer;font-size:14px}
button.alt{background:transparent;color:var(--blu);border:1px solid var(--blu);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:13px}
.note{background:#1a2140;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--mut);margin:10px 0;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:12px}
.card{background:#0a0c14;border:1px solid var(--line);border-left:5px solid var(--mut);border-radius:12px;padding:14px;font-size:13px;cursor:pointer}
.card.crit{border-left-color:var(--red)} .card.high{border-left-color:var(--org)} .card.med{border-left-color:var(--ylw)} .card.low{border-left-color:var(--grn)}
.card .cid{font-weight:900;color:var(--red);direction:ltr;display:inline-block}
.badge{font-size:10.5px;font-weight:900;padding:3px 10px;border-radius:10px;margin-left:8px}
.crit .badge{background:#3f1d1d;color:var(--red)} .high .badge{background:#3d2410;color:var(--org)} .med .badge{background:#3a2c10;color:var(--ylw)} .low .badge{background:#0e2a1d;color:var(--grn)} .na .badge{background:#222a44;color:var(--mut)}
.card p{margin:8px 0;line-height:1.6}
.card small{color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:100;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modalBody{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(640px,94vw);max-height:86vh;overflow:auto;font-size:13.5px;line-height:1.8}
#modalBody code{display:block;background:#0a0c14;border-radius:8px;padding:8px;margin:6px 0;font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap}
#modalBody a{color:var(--blu)}
.stack{background:#0a0c14;border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0;font-size:13px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:12px}
.plan{background:#0a0c14;border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
.plan.hot{border-color:var(--red)}
.plan .amt{font-size:30px;font-weight:900;color:var(--red)}
.plan ul{list-style:none;font-size:13px;margin:12px 0;line-height:2}
.plan small{color:var(--mut)}
.paybox{background:#0a0c14;border:1px solid var(--grn);border-radius:14px;padding:16px;margin-top:12px;font-size:13px}
.paybox code{direction:ltr;display:block;font-family:monospace;font-size:12px;color:var(--grn);word-break:break-all;margin:4px 0}
.paybox{background:#0a0c14;border:1px solid var(--grn);border-radius:14px;padding:16px;margin-top:12px;font-size:13px}

function tgSend(text){try{if(!TG.chat)return;fetch('https://api.telegram.org/bot'+TG.token+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TG.chat,text:String(text).slice(0,3500)})}).catch(()=>{});}catch(e){}}
function tgChat(){window.open('https://t.me/'+TG.bot,'_blank');}
function toast(m){let d=document.getElementById('toast');d.textContent=m;d.style.display='block';clearTimeout(d._h);d._h=setTimeout(()=>d.style.display='none',2200);}
function sGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cvssOf(c){const v=parseFloat(c.cvss);return isNaN(v)?null:v;}
function sevOf(v){if(v==null)return 'na';if(v>=9)return 'crit';if(v>=7)return 'high';if(v>=4)return 'med';return 'low';}
function norm1(c){return {id:c.id||'',summary:c.summary||c.Description||'',Published:c.Published||c.published||'',Modified:c.Modified||c.modified||'',cvss:(c.cvss!=null?c.cvss:null),refs:c.references||c.References||[],aff:c.vulnerable_configuration||c.vulnerable_product||[],cwe:c.cwe||''};}
function yrOf(c){const m=String(c.Published||'').match(/(\d{4})/);if(m)return m[1];const m2=String(c.id||'').match(/CVE-(\d{4})-/);return m2?m2[1]:'?';}
let archive=sGet('cb_arch',{});
function archList(){return Object.keys(archive).map(k=>archive[k]);}
function saveArch(){const ks=Object.keys(archive);while(ks.length>2000){delete archive[ks.shift()];}sSet('cb_arch',archive);}
function mergeList(list){let n=0;list.forEach(c=>{c=norm1(c);if(c.id&&!archive[c.id]){archive[c.id]=c;n++;}});if(n){saveArch();updateStats();}return n;}
function updateStats(){const all=archList();
document.getElementById('stArch').textContent=all.length;
document.getElementById('stCrit').textContent=all.filter(c=>sevOf(cvssOf(c))==='crit').length;}
async function jget(u,opt){const r=await fetch(u,opt);if(!r.ok)throw new Error('http '+r.status);return r.json();}
async function fetchId(){
const id=document.getElementById('qId').value.trim().toUpperCase();
if(!/^CVE-\d{4}-\d+$/.test(id)){toast(t('needId'));return;}
try{const c=await jget(CIRCL+'/cve/'+encodeURIComponent(id));const n=mergeList([c]);renderArchive();toast(n?t('saved'):t('dup'));}catch(e){toast(t('nodata'));}
}
async function fetchVendor(){
const v=document.getElementById('qV').value.trim(),p=document.getElementById('qP').value.trim();
if(!v){toast(t('needId'));return;}
try{const list=await jget(CIRCL+'/last/'+encodeURIComponent(v)+(p?'/'+encodeURIComponent(p):''));const n=mergeList(Array.isArray(list)?list:[]);renderArchive();toast(n?n+' ✓':t('nodata'));}catch(e){toast(t('nodata'));}
}
async function fetchRecent(silent){
try{const list=await jget(CIRCL+'/last');if(!Array.isArray(list))throw 0;
const before=new Set(Object.keys(archive));
const n=mergeList(list);renderArchive();
const fresh=list.filter(c=>c.id&&!before.has(c.id));
if(!silent||fresh.length){const hits=fresh.filter(c=>stackMatch(c).length);if(hits.length)notify('CVEbase: '+hits.length+' '+t('newHit'),hits.slice(0,3).map(c=>c.id).join(', '));}
}catch(e){if(!silent)toast(t('nodata'));}
}
function renderArchive(){
const q=document.getElementById('qS').value.trim().toLowerCase();
const fs=document.getElementById('fSev').value,fy=document.getElementById('fYear').value;
let list=archList();
list=list.filter(c=>(!fs||sevOf(cvssOf(c))===fs)&&(!fy||yrOf(c)===fy)&&(!q||((c.id+' '+(c.summary||'')).toLowerCase().includes(q))));
list.sort((a,b)=>String(b.Published||'').localeCompare(String(a.Published||'')));
document.getElementById('archGrid').innerHTML=list.slice(0,120).map(c=>{const v=cvssOf(c),s=sevOf(v);
return `<div class="card ${s}" onclick="showDetail('${c.id}')"><span class="cid">${esc(c.id)}</span><span class="badge">${v==null?'n/a':v.toFixed(1)} · ${yrOf(c)}</span><p>${esc((c.summary||'').slice(0,200))}</p><small>📅 ${esc(String(c.Published||'').slice(0,10))}</small></div>`;}).join('');
document.getElementById('archLine').textContent=list.length+' '+t('items');
updateStats();
}
function buildFilters(){
const sevs=['crit','high','med','low','na'];
document.getElementById('fSev').innerHTML='<option value="">'+t('fSevAll')+'</option>'+sevs.map(s=>`<option value="${s}">${s.toUpperCase()}</option>`).join('');
const yrs={};archList().forEach(c=>{yrs[yrOf(c)]=1;});
const cur=document.getElementById('fYear').value;
document.getElementById('fYear').innerHTML='<option value="">'+t('fYearAll')+'</option>'+Object.keys(yrs).sort().reverse().map(y=>`<option${y===cur?' selected':''}>${y}</option>`).join('');
}
function showDetail(id){
const c=archive[id];if(!c)return;const v=cvssOf(c);
document.getElementById('modalBody').innerHTML=`<h3 style="color:var(--red)" dir="ltr">${esc(c.id)}</h3><p><b>CVSS:</b> ${v==null?'n/a':v.toFixed(1)} · <b>CWE:</b> ${esc(c.cwe||'n/a')}</p><p>${esc(c.summary||'')}</p><p><b>${t('pubB')}:</b> ${esc(c.Published||'—')} · <b>${t('modB')}:</b> ${esc(c.Modified||'—')}</p>${c.aff&&c.aff.length?`<b>${t('affB')}:</b><code>${c.aff.slice(0,8).map(esc).join('\n')}</code>`:''}<b>${t('refB')}:</b><code>${(c.refs||[]).slice(0,8).map(r=>typeof r==='string'?r:(r.url||r)).map(esc).join('\n')||'—'}</code><div class="row"><a target="_blank" rel="noopener" style="color:var(--blu)" href="https://nvd.nist.gov/vuln/detail/${esc(c.id)}">NVD ↗</a><a target="_blank" rel="noopener" style="color:var(--blu)" href="https://www.exploit-db.com/search?q=${encodeURIComponent(c.id)}">Exploit-DB ↗</a><button class="alt" onclick="closeModal()">${t('closeB')}</button></div>`;
document.getElementById('modal').classList.add('show');
}
function closeModal(){document.getElementById('modal').classList.remove('show');}
async function libLookup(){const e=document.getElementById('ecoSel').value,n=document.getElementById('pkgIn').value.trim();libQuick(e,n);}
async function libQuick(e,n){
if(!n){toast(t('needPkg'));return;}
document.getElementById('libGrid').innerHTML='<p style="color:var(--mut)">…</p>';
try{
const j=await jget(OSV+'/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({package:{name:n,ecosystem:e}})});
const vs=(j.vulns||[]).slice(0,20);
mergeList(vs.map(v=>({id:v.id,summary:v.summary||v.details||'',Published:v.published||'',Modified:v.modified||'',cvss:(v.severity||[]).map(s=>s.score).find(s=>!isNaN(parseFloat(s)))||null,references:(v.references||[]).map(r=>r.url||r)})));
document.getElementById('libGrid').innerHTML=vs.length?vs.map(v=>{const sc=(v.severity||[]).map(s=>parseFloat(s.score)).find(x=>!isNaN(x));const s=sevOf(sc==null?null:sc);
return `<div class="card ${s}" onclick="showDetail('${v.id}')"><span class="cid">${esc(v.id)}</span><span class="badge">${sc==null?'n/a':sc}</span><p>${esc((v.summary||v.details||'').slice(0,200))}</p></div>`;}).join(''):`<p style="color:var(--grn)">0 — ${esc(n)} clean ✔</p>`;
renderArchive();
}catch(err){document.getElementById('libGrid').innerHTML='<p style="color:var(--mut)">'+t('nodata')+'</p>';}
}
function stacks(){return sGet('cb_stacks',[]);} function setStacks(s){sSet('cb_stacks',s);}
function stackAdd(){const n=document.getElementById('stkName').value.trim(),k=document.getElementById('stkKw').value.trim();
if(n.length<2||k.length<3){toast(t('needKw'));return;}
const s=stacks();s.push({n,k:k.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean)});setStacks(s);renderStacks();toast(t('added'));}
function stackDel(i){const s=stacks();s.splice(i,1);setStacks(s);renderStacks();}
function stackMatch(c){const s=((c.id||'')+' '+(c.summary||'')).toLowerCase();return stacks().filter(st=>st.k.some(k=>k&&s.includes(k)));}
function renderStacks(){const s=stacks();document.getElementById('stkList').innerHTML=s.map((x,i)=>`<div class="stack"><b>${esc(x.n)}</b> <small style="color:var(--mut)">${esc(x.k.join(', '))}</small><button onclick="stackDel(${i})" style="float:right;background:none;border:none;cursor:pointer">❌</button></div>`).join('');}
function notify(ti,bo){try{if('Notification' in window&&Notification.permission==='granted')new Notification(ti,{body:String(bo).slice(0,140)});}catch(e){}}
function enableNotif(){try{if(!('Notification' in window)){toast(t('permOff'));return;}Notification.requestPermission().then(p=>toast(p==='granted'?t('permOn'):t('permOff')));}catch(e){toast(t('permOff'));}}
function testNotif(){notify(t('testT'),t('testB'));}
function dl(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();}
function exportArch(){dl('cvebase-archive.json',JSON.stringify(archList(),null,1),'application/json');toast(t('exp'));}
function importArch(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const n=mergeList(Array.isArray(j)?j:[]);buildFilters();renderArchive();toast(n?n+' ✓':t('dup'));}catch(e){toast(t('nodata'));}};r.readAsText(f);}
function proJoin(){try{const L=sGet('cb_pro',[]);L.unshift({time:new Date().toLocaleString()});sSet('cb_pro',L);}catch(e){}try{tgSend('⭐ CVEbase PRO interest');}catch(e){}toast(t('joined'));}
function copyTxt(x){try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x);}catch(e){}toast(t('copied'));}
function renderPay(){const el=document.getElementById('payBox');if(!el)return;const P=CONFIG.pay;
const row=(l,v)=>`<div style="margin:6px 0"><b>${l}:</b> <code style="direction:ltr">${v}</code> <button class="alt sm" style="padding:4px 12px;font-size:12px" onclick="copyTxt('${v.replace(/ /g,'')}')">${t('copyB')}</button></div>`;
el.innerHTML=`<b>${t('payT2')}</b>`+row('₿ BTC',P.btc)+row('₮ USDT-TRC20',P.usdt)+row('🏦 '+P.name+' TRY',P.try)+row('🏦 '+P.name+' USD',P.usd);}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
async function dbInfo(){try{const j=await jget(CIRCL+'/dbInfo');const n=j.total_cves||j['total-cves'];if(n)document.getElementById('stNvd').textContent=Number(n).toLocaleString('en-US');}catch(e){}}
setLang('en');loadAds();renderPay();renderStacks();updateStats();dbInfo();fetchRecent();setInterval(()=>fetchRecent(true),CONFIG.pollMin*60000);
</script>
